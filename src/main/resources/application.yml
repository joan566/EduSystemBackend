spring:
  application:
    name: edusistem-backend
  config:
    # Variables locales en .env (raíz del proyecto, ignorado por git). Las variables de entorno reales tienen prioridad,
    # así que en servidores/CI se siguen configurando como siempre. Si no existe .env, se ignora.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edusystem}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      data-source-properties:
        # Quita el DETAIL de PostgreSQL de los mensajes de error ("Key (email)=(x@y.com) already exists"...), que
        # acabaría en los logs y las trazas con datos personales.
        logServerErrorDetail: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 60MB
      max-request-size: 60MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  # Detrás de un proxy inverso (nginx, balanceador...) usar "native": la IP real del cliente sale de X-Forwarded-For,
  # imprescindible para los límites por IP. Solo se confía en proxies de redes internas
  # (server.tomcat.remoteip.internal-proxies). Sin proxy dejar "none": si no, un cliente podría falsear su IP.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  error:
    include-stacktrace: never
    include-message: never

edusistem:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION:3600}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    login-rate-limit:
      max-attempts-per-email: ${LOGIN_MAX_ATTEMPTS_PER_EMAIL:5}
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:50}
      window-minutes: ${LOGIN_LOCK_WINDOW_MINUTES:15}
    # Peticiones permitidas (max) por ventana deslizante (window-minutes); al superarlas se responde 429.
    rate-limits:
      register-per-ip: { max: 10, window-minutes: 60 }
      forgot-password-per-email: { max: 3, window-minutes: 60 }
      forgot-password-per-ip: { max: 20, window-minutes: 60 }
      # Verificaciones de código (verify-code + reset-password). Junto con los 5 intentos por código, acota la fuerza
      # bruta del código de 6 dígitos a ~10 intentos al día por cuenta.
      reset-code-per-email: { max: 10, window-minutes: 1440 }
      reset-code-per-ip: { max: 50, window-minutes: 15 }
  cors:
    # Orígenes permitidos separados por coma (admite patrones: https://*.miapp.com). Vacío = CORS deshabilitado.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  app-version:
    # Versiones de la app móvil (X.Y.Z) que consulta GET /api/v1/app/version. Por debajo de minimum la actualización
    # es obligatoria; entre minimum y latest es opcional. Si son inválidas o minimum > latest, la app no arranca.
    latest: ${APP_LATEST_VERSION:1.0.0}
    minimum: ${APP_MINIMUM_VERSION:1.0.0}
  school:
    # Zona horaria IANA del colegio: define qué día es "hoy" en la agenda del profesor.
    timezone: ${SCHOOL_TIMEZONE:America/Bogota}
  storage:
    base-path: ${STORAGE_PATH:./storage}
    # Clave AES-256 en Base64 (openssl rand -base64 32) para cifrar fotos de hojas, PDF y Excel guardados. Vacía = sin
    # cifrar. Si se pierde, los archivos cifrados no se pueden recuperar: guárdala aparte de los backups.
    encryption-key: ${STORAGE_ENCRYPTION_KEY:}
  audit:
    # Días que se conserva la auditoría de los profesores y la de intentos sin usuario (guardan el correo escrito)
    retention-days: ${AUDIT_RETENTION_DAYS:730}
    anonymous-retention-days: ${AUDIT_ANONYMOUS_RETENTION_DAYS:30}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@edusistem.local}
  password-reset:
    code-ttl-minutes: 15
    max-attempts: 5
  omr:
    # Confianza mínima para aceptar una respuesta automáticamente (menos => REVIEW_REQUIRED)
    review-confidence-threshold: 0.90
    # Fracción de relleno de una burbuja a partir de la cual se considera marcada / dudosa
    mark-threshold: 0.45
    ambiguity-threshold: 0.20
  imports:
    # Días que se conservan el Excel subido y el informe de errores de una importación terminada (el resumen se conserva)
    file-retention-days: ${IMPORT_FILE_RETENTION_DAYS:30}
  submission-batches:
    # PDF con hojas escaneadas que se procesan a la vez en segundo plano (cada uno usa un hilo)
    workers: ${SUBMISSION_BATCH_WORKERS:2}
    # Días que se conserva el PDF original de un lote terminado (los resultados se conservan siempre)
    file-retention-days: ${SUBMISSION_BATCH_FILE_RETENTION_DAYS:30}

# Documentación OpenAPI/Swagger: desactivada por defecto (no exponer el mapa de la API en producción).
springdoc:
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}
    path: /swagger-ui.html
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
    path: /v3/api-docs

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
