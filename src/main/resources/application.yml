spring:
  application:
    name: edusistem-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/edusistem}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

edusistem:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION:3600}
      refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
    login-rate-limit:
      max-attempts-per-email: ${LOGIN_MAX_ATTEMPTS_PER_EMAIL:5}
      max-attempts-per-ip: ${LOGIN_MAX_ATTEMPTS_PER_IP:50}
      window-minutes: ${LOGIN_LOCK_WINDOW_MINUTES:15}
  cors:
    # Orígenes permitidos separados por coma (admite patrones: https://*.miapp.com). Vacío = CORS deshabilitado.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  storage:
    base-path: ${STORAGE_PATH:./storage}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@edusistem.local}
  password-reset:
    code-ttl-minutes: 15
    max-attempts: 5
  omr:
    # Confianza mínima para aceptar una respuesta automáticamente (menos => REVIEW_REQUIRED)
    review-confidence-threshold: 0.90
    # Fracción de relleno de una burbuja a partir de la cual se considera marcada / dudosa
    mark-threshold: 0.45
    ambiguity-threshold: 0.20

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
